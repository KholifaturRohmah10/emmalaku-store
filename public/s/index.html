<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <meta name="description" content="Halaman hasil scan QR untuk melihat rincian pesanan EMMALAKU.">
        <title>QR Struk | EMMALAKU</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

                    <link rel="preload" as="style" href="https://emmalaku-store.vercel.app/build/assets/app-ujaff8T_.css" /><link rel="stylesheet" href="https://emmalaku-store.vercel.app/build/assets/app-ujaff8T_.css" />            </head>
    <body data-page="receipt-scan">
        <main class="scan-page">
                        <section class="scan-empty">
            <article class="scan-empty__card">
                <button
                    type="button"
                    class="scan-modal__close"
                    aria-label="Kembali"
                    onclick="if (window.history.length > 1) { window.history.back(); } else { window.location.href='https://emmalaku-store.vercel.app/beranda'; }"
                >
                    ×
                </button>
                <h1>Struk tidak tersedia</h1>
                <p>QR ini belum berisi data pesanan yang valid atau link-nya tidak lengkap.</p>
                <a href="https://emmalaku-store.vercel.app/beranda" class="button button--primary">Kembali ke Dashboard</a>
            </article>
        </section>
            </main>
    </body>
</html>
